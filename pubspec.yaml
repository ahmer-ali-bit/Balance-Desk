name: shop
description: "Desktop shop ledger management system."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  open_filex: ^4.5.0
  package_info_plus: ^8.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.11.3
  printing: ^5.14.2
  provider: ^6.1.5+1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.13
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/branding/balance-desk-app-icon-1024.png
    # PdfService loads these font files directly through rootBundle. Declaring
    # them as assets as well as app fonts ensures that works in release builds.
    - assets/fonts/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700

msix_config:
  display_name: Balance Desk
  publisher_display_name: Balance Desk
  identity_name: BalanceDesk.App
  publisher: CN=Balance Desk
  msix_version: 1.0.0.0
  logo_path: assets/branding/balance-desk-app-icon-1024.png
  trim_logo: false
  architecture: x64
  capabilities: internetClient
  output_path: build/windows/msix
  output_name: balance-desk

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"

  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
