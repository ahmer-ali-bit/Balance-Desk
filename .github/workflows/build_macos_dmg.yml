name: Build macOS DMG

on:
  push:
    branches: [main, arena/c3ba4f3f-balance-desk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Compile release app
        id: compile
        shell: bash
        run: |
          set +e
          flutter build macos --release 2>&1 | tee macos-build.log
          build_status=${PIPESTATUS[0]}
          {
            echo '### macOS release build output'
            echo '```text'
            tail -n 160 macos-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$build_status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Pro-macOS-build-log
          path: macos-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package drag-to-Applications DMG
        run: |
          brew install create-dmg
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/packaging/stage
          ditto "$APP_PATH" "build/packaging/stage/Ledger Pro.app"
          rm -rf build/packaging/stage/.background
          create-dmg \
            --volname "Ledger Pro" \
            --window-pos 200 120 \
            --window-size 640 400 \
            --icon-size 100 \
            --icon "Ledger Pro.app" 170 190 \
            --app-drop-link 470 190 \
            "build/packaging/Ledger-Pro-macOS.dmg" \
            "build/packaging/stage"

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-Pro-macOS-DMG
          path: build/packaging/Ledger-Pro-macOS.dmg
          if-no-files-found: error
          retention-days: 14
