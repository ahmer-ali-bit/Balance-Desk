name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Run tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/tests.log" <<'PYTHON'
          import sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          for i in range(0, len(text), 3000):
              chunk = text[i:i + 3000].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print(f'::error title=Flutter test output::{chunk}')
          PYTHON
          fi
          exit "$result"
      - name: Analyze project
        if: always()
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/analyze.log"
          python3 - "$RUNNER_TEMP/analyze.log" <<'PYTHON'
          import re
          import sys

          for line in open(sys.argv[1], encoding='utf-8'):
              match = re.search(r'(error|warning) • (.*?) • (.*?):(\d+):(\d+) • (.*)', line)
              if match:
                  level, message, path, row, column, rule = match.groups()
                  message = message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f'::{level} file={path},line={row},col={column}::{message} ({rule})')
          PYTHON
          exit "$result"

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Save Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Desk-Windows-UI-preview
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android app
        run: flutter build apk --debug
      - name: Save Android test build
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Desk-Android-UI-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      # An optimized preview is useful for assessing UI responsiveness; this
      # repository's release variant is still signed with a debug key.
      - name: Build Android release preview
        run: flutter build apk --release
      - name: Save Android release preview
        uses: actions/upload-artifact@v4
        with:
          name: Balance-Desk-Android-release-preview
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
