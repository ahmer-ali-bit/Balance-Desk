name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Analyze project
        if: always()
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/analyze.log"
          python3 - "$RUNNER_TEMP/analyze.log" <<'PYTHON'
          import re
          import sys

          for line in open(sys.argv[1], encoding='utf-8'):
              match = re.search(r'(error|warning) • (.*?) • (.*?):(\d+):(\d+) • (.*)', line)
              if match:
                  level, message, path, row, column, rule = match.groups()
                  message = message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                  print(f'::{level} file={path},line={row},col={column}::{message} ({rule})')
          PYTHON
          exit "$result"
